# Ammo Stays: ammo dropped by enemies no longer disappears.

[manifest]
id = "jfg_ammo_stays"
version = "1.1.0"
display_name = "Ammo Stays"
description = """
Ammo that enemies drop stays where it fell instead of blinking out after a few seconds, so you can finish the fight \
and collect it after. The newest drops are kept (as many as you choose), so the game never runs short of memory in \
long fights. Drone heads can be kept the same way."""
short_description = "Ammo dropped by enemies no longer disappears."
authors = [ "VibinToast" ]
tags = [ "Gameplay" ]
game_id = "jet-force-gemini"
minimum_recomp_version = "1.3.0"
dependencies = [ ]
optional_dependencies = [ ]
native_libraries = [ ]

[[manifest.config_options]]
id = "enabled"
name = "On"
description = "The mod on or off: the mods menu's On/Off switch, which works during play too."
type = "Enum"
options = [ "Off", "On" ]
default = "On"

[[manifest.config_options]]
id = "keep"
name = "Drops Kept"
description = "How many of the newest drops stay; older ones disappear as in the game. More than about 64 can run the game short of memory in big fights."
type = "Number"
min = 8
max = 128
step = 8
precision = 0
percent = false
default = 48

[[manifest.config_options]]
id = "heads"
name = "Drone Heads Stay Too"
description = "Drone heads dropped by enemies stay as well."
type = "Enum"
options = [ "Off", "On" ]
default = "On"

[inputs]
elf_path = "build/mod.elf"
mod_filename = "jfg_ammo_stays"
func_reference_syms_file = "syms/jfg.us.syms.toml"
data_reference_syms_files = [ "syms/jfg.us.datasyms.toml" ]
additional_files = [ "thumb.png" ]
