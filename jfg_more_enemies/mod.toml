# More Enemies: two or three times the enemies in every squad.

[manifest]
id = "jfg_more_enemies"
version = "0.1.0"
display_name = "More Enemies"
description = """
Every squad of enemies comes with more members: twice as many, three times, or anything in between. Flying enemies have their own setting. The extra \
enemies arrive the way the squad's own do, and a squad's door opens once all of them are down. Tribals, bosses and \
big enemies keep their numbers. The extra enemies save no kills, so your saves work the same at any setting: a \
squad you wiped out stays wiped out, and after loading, the extras come back only for the enemies still alive. \
A change takes effect at the next level you enter."""
short_description = "Two or three times the enemies in every squad."
authors = [ "VibinToast" ]
tags = [ "Enemies", "Gameplay" ]
game_id = "jet-force-gemini"
minimum_recomp_version = "1.3.0"
dependencies = [ ]
optional_dependencies = [ ]
native_libraries = [ ]

[[manifest.config_options]]
id = "enabled"
name = "On"
description = "The mod on or off (from the next level you enter)."
type = "Enum"
options = [ "Off", "On" ]
default = "On"

[[manifest.config_options]]
id = "multiplier"
name = "Enemies (%)"
description = "Each squad's size: 200 is twice as many, 300 three times (rounded per squad)."
type = "Number"
min = 100
max = 300
step = 25
precision = 0
percent = false
default = 200

[[manifest.config_options]]
id = "flyers"
name = "Flying Enemies (%)"
description = "Each flying squad's size (drones, sniper drones, flying insects), apart from the rest: more of them spread out along their formation, sometimes over ground you can't reach."
type = "Number"
min = 100
max = 300
step = 25
precision = 0
percent = false
default = 100

[[manifest.config_options]]
id = "sentries"
name = "Sentries Too"
description = "Also multiply enemies that stand guard at one post. They gather in a clump there."
type = "Enum"
options = [ "Off", "On" ]
default = "Off"

[inputs]
elf_path = "build/mod.elf"
mod_filename = "jfg_more_enemies"
func_reference_syms_file = "syms/jfg.us.syms.toml"
data_reference_syms_files = [ "syms/jfg.us.datasyms.toml" ]
additional_files = [ "thumb.png" ]
