[[manifest.config_options]]
id = "plasma"
name = "Plasma Shotgun"
description = "Its charge and its shot. Off: the game's own sound."
type = "Enum"
options = [ "Off", "On" ]
default = "On"

[[manifest.config_options]]
id = "shocker"
