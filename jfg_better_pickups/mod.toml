# Better Pickups: what enemies drop stays until you take it, comes more or less often, and comes to you.

[manifest]
id = "jfg_better_pickups"
version = "2.0.0"
display_name = "Better Pickups"
description = """
Everything enemies drop, your way. The ammo, weapons and drone heads enemies leave behind no longer vanish after a \
few seconds: they wait for you (the newest ones, so the game never runs short of room for more). Set how often enemies \
drop the items other mods add, such as the new weapons' ammo cells: from none to three times as many. And turn on the \
pickup magnet to have drops near you drift into your hands, so you don't have to walk over every one of them in the \
middle of a fight."""
short_description = "Drops stay until you take them, a drop rate for mods' items, and a pickup magnet."
authors = [ "VibinToast" ]
tags = [ "Gameplay" ]
game_id = "jet-force-gemini"
minimum_recomp_version = "1.3.0"
dependencies = [ ]
optional_dependencies = [ ]
native_libraries = [ ]

[[manifest.config_options]]
id = "enabled"
name = "On"
description = "The mod on or off: the mods menu's On/Off switch, which works during play too."
type = "Enum"
options = [ "Off", "On" ]
default = "On"

[[manifest.config_options]]
id = "ammo"
name = "Ammo Stays"
description = "Ammo dropped by enemies stays until you pick it up."
type = "Enum"
options = [ "Off", "On" ]
default = "On"

[[manifest.config_options]]
id = "weapons"
name = "Weapons Stay"
description = "Weapons dropped by enemies stay until you pick them up."
type = "Enum"
options = [ "Off", "On" ]
default = "On"

[[manifest.config_options]]
id = "heads"
name = "Drone Heads Stay"
description = "Drone heads dropped by enemies stay until you pick them up."
type = "Enum"
options = [ "Off", "On" ]
default = "On"

[[manifest.config_options]]
id = "keep"
name = "Drops Kept"
description = "How many of the newest drops are kept at once. Older ones fade as in the game, so the game always has room for new ones."
type = "Number"
min = 8
max = 128
step = 8
precision = 0
percent = false
default = 48

[[manifest.config_options]]
id = "mod_drop_rate"
name = "Mod Drop Rate (%)"
description = "How often enemies drop the items other mods add (the new weapons' ammo cells and the like). 100 is each mod's own rate, 0 none, 300 three times as often."
type = "Number"
min = 0
max = 300
step = 25
precision = 0
percent = false
default = 100

[[manifest.config_options]]
id = "magnet"
name = "Pickup Magnet"
description = "Drops near you drift to you and are picked up: ammo, weapons, drone heads and mods' items. Short reaches a few steps, Long across a room."
type = "Enum"
options = [ "Off", "Short", "Long" ]
default = "Off"

[inputs]
elf_path = "build/mod.elf"
mod_filename = "jfg_better_pickups"
func_reference_syms_file = "syms/jfg.us.syms.toml"
data_reference_syms_files = [ "syms/jfg.us.datasyms.toml" ]
additional_files = [ "thumb.png" ]
