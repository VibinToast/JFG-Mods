# Minimap: a map of the area you are in, always on screen while you play.

[manifest]
id = "jfg_minimap"
version = "1.0.0"
display_name = "Minimap"
description = """
A map of the area you are in, always on screen while you play: drawn from the level itself, so it works in every \
area, custom levels included. You are the yellow arrow, pointing where you face; enemies are red dots (turn them on in its options), tribals \
blue ones, pickups yellow, ammo orange, upgrades purple, health pink and tokens cyan; \
unopened chests and totem poles not yet touched are boxes. Choose its corner, size and opacity."""
short_description = "An always-on map of the area, with you, tribals and pickups."
authors = [ "VibinToast" ]
tags = [ "HUD" ]
game_id = "jet-force-gemini"
minimum_recomp_version = "1.3.0"
dependencies = [ ]
optional_dependencies = [ ]
native_libraries = [ ]

[[manifest.config_options]]
id = "enabled"
name = "On"
description = "The mod on or off: the mods menu's On/Off switch, which works during play too."
type = "Enum"
options = [ "Off", "On" ]
default = "On"

[[manifest.config_options]]
id = "corner"
name = "Corner"
description = "Where the map sits on the screen (the next free corner when another mod's HUD piece is there)."
type = "Enum"
options = [ "Top Left", "Top Right", "Bottom Left", "Bottom Right" ]
default = "Bottom Right"

[[manifest.config_options]]
id = "size"
name = "Size (%)"
description = "The map's size, as a share of the screen's height."
type = "Number"
min = 15
max = 60
step = 1
precision = 0
percent = false
default = 30

[[manifest.config_options]]
id = "opacity"
name = "Opacity (%)"
description = "How solid the map is: lower lets more of the game show through."
type = "Number"
min = 20
max = 100
step = 5
precision = 0
percent = false
default = 75

[[manifest.config_options]]
id = "enemies"
name = "Enemies"
description = "Enemies shown as red dots. Off by default, so the map doesn't give them away."
type = "Enum"
options = [ "Off", "On" ]
default = "Off"

[[manifest.config_options]]
id = "tribals"
name = "Tribals"
description = "Tribals shown as blue dots."
type = "Enum"
options = [ "Off", "On" ]
default = "On"

[[manifest.config_options]]
id = "items"
name = "Items"
description = "Keys, ship parts, Floyd's parts and other pickups (yellow), ammo (orange, small), upgrades (purple), chests not yet opened (yellow boxes) and totem poles (brown)."
type = "Enum"
options = [ "Off", "On" ]
default = "On"

[[manifest.config_options]]
id = "health_tokens"
name = "Health and Tokens"
description = "Health shown as small pink dots and tokens as small cyan dots until taken."
type = "Enum"
options = [ "Off", "On" ]
default = "Off"

[inputs]
elf_path = "build/mod.elf"
mod_filename = "jfg_minimap"
func_reference_syms_file = "syms/jfg.us.syms.toml"
data_reference_syms_files = [ "syms/jfg.us.datasyms.toml" ]
additional_files = [ "thumb.png" ]
