# Blood: the blood and gore options (once the port's own), blood colours per kind of creature, and rainbow blood.

[manifest]
id = "jfg_blood"
version = "1.1.0"
display_name = "Blood"
description = """
Blood your way. Turn blood off, spray more of it, keep splats and severed body parts where they fall, give each kind \
of creature its own blood colour (heroes, Tribals, insects, flyers and drones, the final boss), or turn on the \
game's secret rainbow blood without collecting a single drone head. Change any option in the mod's settings; \
changes apply at once."""
short_description = "Blood options: none, more, splats that stay, colours per creature, rainbow blood."
authors = [ "VibinToast" ]
tags = [ "Visuals" ]
game_id = "jet-force-gemini"
minimum_recomp_version = "1.3.0"
dependencies = [ ]
optional_dependencies = [ ]
native_libraries = [ ]

[[manifest.config_options]]
id = "enabled"
name = "On"
description = "The mod on or off: the mods menu's On/Off switch, which works during play too."
type = "Enum"
options = [ "Off", "On" ]
default = "On"

[[manifest.config_options]]
id = "no_blood"
name = "No Blood"
description = "No blood at all, as in the Japanese version. The other options do nothing while it is on."
type = "Enum"
options = [ "Off", "On" ]
default = "Off"

[[manifest.config_options]]
id = "amount"
name = "Blood Amount (%)"
description = "How much blood a hit sprays. 100 is the original game."
type = "Number"
min = 100
max = 800
step = 10
precision = 0
percent = false
default = 200

[[manifest.config_options]]
id = "keep_blood"
name = "Blood Stays"
description = "Blood splats stay on the ground and walls instead of fading away. Leaving the level clears them."
type = "Enum"
options = [ "Off", "On" ]
default = "On"

[[manifest.config_options]]
id = "splats"
name = "Blood Splat Limit"
description = "How many splats stay with Blood Stays on. Once reached, the oldest makes room for new blood. 64 is the original game's pool."
type = "Number"
min = 64
max = 4096
step = 64
precision = 0
percent = false
default = 960

[[manifest.config_options]]
id = "keep_limbs"
name = "Body Parts Stay"
description = "Severed limbs and heads stay where they fell instead of fading away (the newest 24, so the game does not run out of memory)."
type = "Enum"
options = [ "Off", "On" ]
default = "On"

[[manifest.config_options]]
id = "rainbow"
name = "Rainbow Blood"
description = "The game's secret rainbow blood: every drop takes a random colour. Overrides the colours below for drops."
type = "Enum"
options = [ "Off", "On" ]
default = "Off"

[[manifest.config_options]]
id = "color_heroes"
name = "Heroes' Blood"
description = "The colour of the heroes' (and Floyd's) blood."
type = "Enum"
options = [ "Original", "Red", "Green", "Blue", "Yellow", "Orange", "Purple", "Pink", "Cyan", "White", "Black" ]
default = "Red"

[[manifest.config_options]]
id = "color_tribals"
name = "Tribals' Blood"
description = "The colour of the Tribals' blood."
type = "Enum"
options = [ "Original", "Red", "Green", "Blue", "Yellow", "Orange", "Purple", "Pink", "Cyan", "White", "Black" ]
default = "Blue"

[[manifest.config_options]]
id = "color_insects"
name = "Insects' Blood"
description = "The colour of the green-blooded creatures: the ant soldiers, the other ground insects and most bosses."
type = "Enum"
options = [ "Original", "Red", "Green", "Blue", "Yellow", "Orange", "Purple", "Pink", "Cyan", "White", "Black" ]
default = "Red"

[[manifest.config_options]]
id = "color_flyers"
name = "Flyers' and Drones' Blood"
description = "The colour of the dark-blooded creatures: flying insects, drones and turrets."
type = "Enum"
options = [ "Original", "Red", "Green", "Blue", "Yellow", "Orange", "Purple", "Pink", "Cyan", "White", "Black" ]
default = "Cyan"

[[manifest.config_options]]
id = "color_boss"
name = "Final Boss's Blood"
description = "The colour of the final boss's blood."
type = "Enum"
options = [ "Original", "Red", "Green", "Blue", "Yellow", "Orange", "Purple", "Pink", "Cyan", "White", "Black" ]
default = "Yellow"

[[manifest.config_options]]
id = "color_other"
name = "Others' Blood"
description = "The colour of any other creature's blood."
type = "Enum"
options = [ "Original", "Red", "Green", "Blue", "Yellow", "Orange", "Purple", "Pink", "Cyan", "White", "Black" ]
default = "White"

[inputs]
elf_path = "build/mod.elf"
mod_filename = "jfg_blood"
func_reference_syms_file = "syms/jfg.us.syms.toml"
data_reference_syms_files = [ "syms/jfg.us.datasyms.toml" ]
additional_files = [ "thumb.png" ]
