# Reticle: the aiming reticle your way: no snapping to enemies, other shapes, colours and sizes.

[manifest]
id = "jfg_reticle"
version = "1.1.0"
display_name = "Reticle"
description = """
Make the aiming reticle your own. Stop it from jumping onto an enemy whenever your aim passes over one, and pick \
another shape (a dot, a cross, a circle, corner brackets), its colour, its colour while locked on and its size. \
Changes in the mod's settings apply at once."""
short_description = "No snapping to enemies; reticle shape, colour and size."
authors = [ "VibinToast" ]
tags = [ "HUD" ]
game_id = "jet-force-gemini"
minimum_recomp_version = "1.3.0"
dependencies = [ ]
optional_dependencies = [ ]
native_libraries = [ ]

[[manifest.config_options]]
id = "enabled"
name = "On"
description = "The mod on or off: the mods menu's On/Off switch, which works during play too."
type = "Enum"
options = [ "Off", "On" ]
default = "On"

[[manifest.config_options]]
id = "snap"
name = "Snap to Enemies"
description = "Off: the reticle no longer jumps onto an enemy your aim passes over; it stays where you point. Homing weapons still lock on."
type = "Enum"
options = [ "Off", "On" ]
default = "Off"

[[manifest.config_options]]
id = "shape"
name = "Shape"
description = "The reticle's shape. Game's keeps the original reticle (colour and size then stay the game's)."
type = "Enum"
options = [ "Game's", "Dot", "Cross", "Cross and Dot", "Circle", "Circle and Dot", "Brackets" ]
default = "Circle and Dot"

[[manifest.config_options]]
id = "color"
name = "Colour"
description = "The reticle's colour."
type = "Enum"
options = [ "White", "Red", "Green", "Cyan", "Yellow", "Magenta", "Orange" ]
default = "Red"

[[manifest.config_options]]
id = "lock_color"
name = "Locked Colour"
description = "The reticle's colour while it is locked on a target (homing weapons, or with Snap to Enemies on)."
type = "Enum"
options = [ "White", "Red", "Green", "Cyan", "Yellow", "Magenta", "Orange" ]
default = "Magenta"

[[manifest.config_options]]
id = "size"
name = "Size (%)"
description = "The reticle's size. 100 is a small reticle; it grows with the screen's resolution."
type = "Number"
min = 50
max = 300
step = 10
precision = 0
percent = false
default = 150

[[manifest.config_options]]
id = "outline"
name = "Dark Outline"
description = "A dark edge around the reticle, so it shows on bright and dark ground alike."
type = "Enum"
options = [ "Off", "On" ]
default = "Off"

[inputs]
elf_path = "build/mod.elf"
mod_filename = "jfg_reticle"
func_reference_syms_file = "syms/jfg.us.syms.toml"
data_reference_syms_files = [ "syms/jfg.us.datasyms.toml" ]
additional_files = [ "thumb.png" ]
