# Plasma Vortex: charged plasma shotgun shots pull enemies in, then burst.

[manifest]
id = "jfg_plasma_vortex"
version = "1.0.0"
display_name = "Plasma Vortex"
description = """
The plasma shotgun becomes a vortex gun. A charged shot slows to a hover and drags the enemies around it in: they slide toward \
the ball, glowing blue, bunch up around it and take damage while they are close. When the ball's time runs out or it \
hits a wall, it bursts in a plasma flash that hits everything it gathered, hard enough to blow the weak ones apart. \
The more you charge, the further it reaches and the harder it pulls. Tribals are never pulled or hurt by it, and \
nothing is pulled through walls. Every part can be turned up, down or off."""
short_description = "Charged plasma shots pull enemies in, then burst."
authors = [ "VibinToast" ]
tags = [ "Weapons" ]
game_id = "jet-force-gemini"
minimum_recomp_version = "1.3.0"
dependencies = [ ]
optional_dependencies = [ ]
native_libraries = [ ]

[[manifest.config_options]]
id = "enabled"
name = "On"
description = "The mod on or off: the mods menu's On/Off switch, which works during play too. Off leaves the plasma shotgun as the game made it."
type = "Enum"
options = [ "Off", "On" ]
default = "Off"

[[manifest.config_options]]
id = "min_charge"
name = "Charge Needed"
description = "How charged a shot must be to become a vortex: 1 every shot, 4 only a full charge."
type = "Number"
min = 1
max = 4
step = 1
precision = 0
percent = false
default = 2

[[manifest.config_options]]
id = "hover"
name = "Hover Time (s)"
description = "A vortex slows to a stop and hangs in the air this long before it bursts, pulling all the while. 0: it flies on as the game's shot does and bursts where it ends."
type = "Number"
min = 0
max = 3
step = 0.5
precision = 1
percent = false
default = 1

[[manifest.config_options]]
id = "reach"
name = "Pull Reach"
description = "How far a fully charged shot pulls from, in the game's units (a less charged one reaches less)."
type = "Number"
min = 100
max = 600
step = 25
precision = 0
percent = false
default = 300

[[manifest.config_options]]
id = "pull"
name = "Pull Strength (%)"
description = "How hard enemies are dragged in."
type = "Number"
min = 25
max = 400
step = 25
precision = 0
percent = false
default = 200

[[manifest.config_options]]
id = "damage"
name = "Vortex Damage (%)"
description = "Damage to enemies close to the ball while it flies, as a share of one unit of health a second."
type = "Number"
min = 0
max = 500
step = 25
precision = 0
percent = false
default = 100

[[manifest.config_options]]
id = "burst"
name = "Burst Damage"
description = "The burst's blow at full charge, in units of health (an ant soldier has a few)."
type = "Number"
min = 0
max = 20
step = 1
precision = 0
percent = false
default = 6

[[manifest.config_options]]
id = "stun"
name = "Stun"
description = "Caught enemies are stunned (shaking, held by the current) instead of just turning on you."
type = "Enum"
options = [ "Off", "On" ]
default = "Off"

[[manifest.config_options]]
id = "tint"
name = "Blue Glow"
description = "Caught enemies glow blue."
type = "Enum"
options = [ "Off", "On" ]
default = "On"

[inputs]
elf_path = "build/mod.elf"
mod_filename = "jfg_plasma_vortex"
func_reference_syms_file = "syms/jfg.us.syms.toml"
data_reference_syms_files = [ "syms/jfg.us.datasyms.toml" ]
additional_files = [ "thumb.png" ]
